<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily Expenses</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f4f0fa;color:#1a0533;font-size:15px}

/* Pi colour palette */
:root{
  --pi-purple:#6528B4;
  --pi-purple-dark:#3D1570;
  --pi-purple-light:#EDE5FA;
  --pi-gold:#F0A500;
  --pi-gold-light:#FDF3D9;
  --pi-surface:#fff;
  --pi-bg:#f4f0fa;
  --pi-text:#1a0533;
  --pi-muted:#7a5e99;
  --pi-border:rgba(101,40,180,0.15);
}

.app{max-width:700px;margin:0 auto;padding:1rem}

/* Header */
.header{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;padding:1rem 1.25rem;background:var(--pi-purple-dark);border-radius:14px;color:#fff}
.header-icon{width:38px;height:38px;background:var(--pi-gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--pi-purple-dark);flex-shrink:0}
.header h1{font-size:19px;font-weight:600;color:#fff}
.header p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:1px}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:1.5rem;background:var(--pi-purple-light);border-radius:10px;padding:4px}
.tab{flex:1;padding:7px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--pi-purple);transition:all 0.15s}
.tab.active{background:var(--pi-purple);color:#fff;box-shadow:0 1px 4px rgba(101,40,180,0.25)}

/* Cards */
.card{background:var(--pi-surface);border:1px solid var(--pi-border);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem}
.card-title{font-size:15px;font-weight:600;color:var(--pi-purple-dark);margin-bottom:1rem}

/* Form */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--pi-muted);margin-bottom:4px;font-weight:500}
input,select{width:100%;padding:9px 11px;border:1.5px solid var(--pi-border);border-radius:9px;font-size:14px;background:#faf8ff;color:var(--pi-text)}
input:focus,select:focus{outline:none;border-color:var(--pi-purple)}
.btn-add{width:100%;padding:10px;border:none;border-radius:9px;background:var(--pi-purple);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;letter-spacing:0.2px}
.btn-add:hover{background:var(--pi-purple-dark)}

/* Metrics */
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.metric{background:var(--pi-surface);border:1px solid var(--pi-border);border-radius:12px;padding:12px 14px}
.metric-label{font-size:11px;color:var(--pi-muted);margin-bottom:4px;font-weight:500}
.metric-value{font-size:20px;font-weight:700;color:var(--pi-purple-dark)}
.metric.gold{background:var(--pi-gold-light);border-color:rgba(240,165,0,0.3)}
.metric.gold .metric-value{color:#7a4d00}
.metric.gold .metric-label{color:#a06b00}

/* Period tabs */
.period-tabs{display:flex;gap:6px;margin-bottom:1rem}
.period-tab{padding:5px 14px;border:1.5px solid var(--pi-border);border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:var(--pi-muted)}
.period-tab.active{background:var(--pi-purple);border-color:var(--pi-purple);color:#fff}

/* Expense items */
.expense-list{display:flex;flex-direction:column;gap:6px}
.expense-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--pi-purple-light);border-radius:10px}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.exp-info{flex:1;min-width:0}
.exp-top{display:flex;justify-content:space-between;align-items:center}
.exp-name{font-size:14px;font-weight:600;color:var(--pi-purple-dark)}
.exp-amount{font-size:14px;font-weight:700;color:var(--pi-purple)}
.exp-meta{font-size:11px;color:var(--pi-muted);margin-top:2px}
.btn-del{border:none;background:none;cursor:pointer;color:var(--pi-muted);padding:2px;border-radius:4px}
.btn-del:hover{color:#E24B4A}

/* Category filter pills */
.cat-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.cat-pill{padding:4px 11px;border-radius:20px;font-size:12px;cursor:pointer;border:1.5px solid var(--pi-border);background:transparent;color:var(--pi-muted);font-weight:500}

/* Summary rows */
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--pi-border);font-size:14px;color:var(--pi-text)}
.summary-row:last-child{border-bottom:none;font-weight:700;font-size:15px;padding-top:10px;color:var(--pi-purple-dark)}

.empty{text-align:center;padding:2rem;color:var(--pi-muted);font-size:14px}
.chart-wrap{position:relative;width:100%;height:220px}

/* Today total badge */
.today-badge{background:var(--pi-gold);color:#3a2000;font-size:14px;font-weight:700;padding:3px 10px;border-radius:20px}

/* Pi branding footer */
.pi-footer{text-align:center;padding:1rem 0 0.5rem;font-size:11px;color:var(--pi-muted)}
.pi-logo{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--pi-purple)}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-icon"><i class="ti ti-wallet" aria-hidden="true"></i></div>
    <div>
      <h1>My Daily Expenses</h1>
      <p>Track every ringgit, every day</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('add')">Add Expense</button>
    <button class="tab" onclick="switchTab('list')">Expenses</button>
    <button class="tab" onclick="switchTab('summary')">Summary</button>
  </div>

  <!-- ADD TAB -->
  <div id="tab-add">
    <div class="card">
      <div class="card-title">New expense</div>
      <div class="form-row">
        <div><label>Date</label><input type="date" id="inp-date"></div>
        <div><label>Amount (RM)</label><input type="number" id="inp-amount" placeholder="0.00" min="0" step="0.01"></div>
      </div>
      <div class="form-row">
        <div><label>Category</label>
          <select id="inp-cat">
            <option value="Food & Drinks">Food & Drinks</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills & Utilities">Bills & Utilities</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Education">Education</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div><label>Note (optional)</label><input type="text" id="inp-note" placeholder="e.g. Lunch at Mamak"></div>
      </div>
      <button class="btn-add" onclick="addExpense()"><i class="ti ti-plus" aria-hidden="true"></i> Add Expense</button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">Today's expenses</div>
        <span id="today-total" class="today-badge"></span>
      </div>
      <div id="today-list"></div>
    </div>
  </div>

  <!-- LIST TAB -->
  <div id="tab-list" style="display:none">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">All expenses</div>
        <select id="sort-sel" onchange="renderList()" style="width:auto;font-size:13px;padding:5px 8px">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="amount-desc">Highest amount</option>
          <option value="amount-asc">Lowest amount</option>
        </select>
      </div>
      <div class="cat-filter" id="cat-filter"></div>
      <div class="expense-list" id="main-list"></div>
    </div>
  </div>

  <!-- SUMMARY TAB -->
  <div id="tab-summary" style="display:none">
    <div class="period-tabs">
      <button class="period-tab active" onclick="setPeriod('daily')">Daily</button>
      <button class="period-tab" onclick="setPeriod('weekly')">Weekly</button>
      <button class="period-tab" onclick="setPeriod('monthly')">Monthly</button>
      <button class="period-tab" onclick="setPeriod('yearly')">Yearly</button>
    </div>
    <div class="metric-grid">
      <div class="metric gold"><div class="metric-label">Total spent</div><div class="metric-value" id="s-total">RM0</div></div>
      <div class="metric"><div class="metric-label">Transactions</div><div class="metric-value" id="s-count">0</div></div>
      <div class="metric"><div class="metric-label">Avg per day</div><div class="metric-value" id="s-avg">RM0</div></div>
      <div class="metric"><div class="metric-label">Top category</div><div class="metric-value" id="s-top" style="font-size:13px">—</div></div>
    </div>
    <div class="card">
      <div class="card-title">Spending by category</div>
      <div class="chart-wrap"><canvas id="cat-chart" role="img" aria-label="Doughnut chart of spending by category">Category breakdown.</canvas></div>
      <div id="cat-legend" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:#7a5e99"></div>
    </div>
    <div class="card">
      <div class="card-title">Category breakdown</div>
      <div id="cat-breakdown"></div>
    </div>
  </div>

  <div class="pi-footer">
    <span class="pi-logo"><i class="ti ti-circle-letter-p" style="font-size:14px" aria-hidden="true"></i> Pi Browser App</span>
  </div>
</div>

<script>
const CAT_COLORS = {
  'Food & Drinks':'#6528B4','Transport':'#1D9E75','Shopping':'#F0A500',
  'Bills & Utilities':'#3D1570','Health':'#D85A30','Entertainment':'#9B59B6',
  'Education':'#3B6D11','Others':'#7a5e99'
};

let expenses = JSON.parse(localStorage.getItem('mde_pi_expenses') || '[]');
let activeTab='add', activePeriod='daily', activeFilter='All', catChart=null;

function save(){ localStorage.setItem('mde_pi_expenses', JSON.stringify(expenses)); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'}); }
function fmtAmt(n){ return 'RM '+parseFloat(n).toFixed(2); }

function switchTab(t){
  activeTab=t;
  ['add','list','summary'].forEach(x=>{ document.getElementById('tab-'+x).style.display=x===t?'block':'none'; });
  document.querySelectorAll('.tab').forEach((el,i)=>{ el.classList.toggle('active',['add','list','summary'][i]===t); });
  if(t==='add') renderToday();
  if(t==='list') renderList();
  if(t==='summary') renderSummary();
}

function addExpense(){
  const date=document.getElementById('inp-date').value||today();
  const amount=parseFloat(document.getElementById('inp-amount').value);
  const cat=document.getElementById('inp-cat').value;
  const note=document.getElementById('inp-note').value.trim();
  if(!amount||amount<=0){ alert('Please enter a valid amount.'); return; }
  expenses.push({id:Date.now(),date,amount,cat,note});
  expenses.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  save();
  document.getElementById('inp-amount').value='';
  document.getElementById('inp-note').value='';
  renderToday();
}

function deleteExpense(id){
  expenses=expenses.filter(e=>e.id!==id); save();
  renderToday();
  if(activeTab==='list') renderList();
  if(activeTab==='summary') renderSummary();
}

function renderItem(e,container){
  const div=document.createElement('div');
  div.className='expense-item';
  div.innerHTML=`<div class="cat-dot" style="background:${CAT_COLORS[e.cat]||'#888'}"></div>
  <div class="exp-info">
    <div class="exp-top"><span class="exp-name">${e.cat}</span><span class="exp-amount">${fmtAmt(e.amount)}</span></div>
    <div class="exp-meta">${fmtDate(e.date)}${e.note?' · '+e.note:''}</div>
  </div>
  <button class="btn-del" onclick="deleteExpense(${e.id})" aria-label="Delete"><i class="ti ti-trash" style="font-size:16px"></i></button>`;
  container.appendChild(div);
}

function renderToday(){
  const td=today();
  const todayExp=expenses.filter(e=>e.date===td);
  const total=todayExp.reduce((s,e)=>s+e.amount,0);
  document.getElementById('today-total').textContent=fmtAmt(total);
  const list=document.getElementById('today-list'); list.innerHTML='';
  if(!todayExp.length){ list.innerHTML='<div class="empty"><i class="ti ti-receipt-off" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>No expenses today yet</div>'; return; }
  todayExp.forEach(e=>renderItem(e,list));
}

function renderList(){
  const filter=activeFilter; const sort=document.getElementById('sort-sel').value;
  const cats=['All',...Object.keys(CAT_COLORS)];
  const fp=document.getElementById('cat-filter'); fp.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('button'); b.className='cat-pill'+(c===filter?' active':'');
    if(c!=='All') b.style.cssText=`background:${filter===c?CAT_COLORS[c]:'transparent'};border-color:${CAT_COLORS[c]};color:${filter===c?'#fff':CAT_COLORS[c]}`;
    b.textContent=c; b.onclick=()=>{ activeFilter=c; renderList(); }; fp.appendChild(b);
  });
  let list=filter==='All'?[...expenses]:expenses.filter(e=>e.cat===filter);
  if(sort==='date-desc') list.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  else if(sort==='date-asc') list.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  else if(sort==='amount-desc') list.sort((a,b)=>b.amount-a.amount);
  else list.sort((a,b)=>a.amount-b.amount);
  const ml=document.getElementById('main-list'); ml.innerHTML='';
  if(!list.length){ ml.innerHTML='<div class="empty">No expenses found</div>'; return; }
  list.forEach(e=>renderItem(e,ml));
}

function setPeriod(p){
  activePeriod=p;
  document.querySelectorAll('.period-tab').forEach((el,i)=>{ el.classList.toggle('active',['daily','weekly','monthly','yearly'][i]===p); });
  renderSummary();
}

function getPeriodExpenses(){
  const now=new Date(); const td=today();
  if(activePeriod==='daily') return expenses.filter(e=>e.date===td);
  if(activePeriod==='weekly'){
    const day=now.getDay(); const mon=new Date(now); mon.setDate(now.getDate()-(day===0?6:day-1)); mon.setHours(0,0,0,0);
    return expenses.filter(e=>new Date(e.date+'T00:00:00')>=mon);
  }
  if(activePeriod==='monthly') return expenses.filter(e=>e.date.slice(0,7)===td.slice(0,7));
  return expenses.filter(e=>e.date.slice(0,4)===td.slice(0,4));
}

function getDayCount(){
  if(activePeriod==='daily') return 1;
  if(activePeriod==='weekly'){ const d=new Date().getDay(); return d===0?7:d; }
  if(activePeriod==='monthly') return new Date().getDate();
  return Math.ceil((new Date()-new Date(new Date().getFullYear(),0,1))/86400000)+1;
}

function renderSummary(){
  const exp=getPeriodExpenses();
  const total=exp.reduce((s,e)=>s+e.amount,0);
  document.getElementById('s-total').textContent=fmtAmt(total);
  document.getElementById('s-count').textContent=exp.length;
  document.getElementById('s-avg').textContent=fmtAmt(total/Math.max(getDayCount(),1));
  const catTotals={};
  exp.forEach(e=>{ catTotals[e.cat]=(catTotals[e.cat]||0)+e.amount; });
  const sorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  document.getElementById('s-top').textContent=sorted.length?sorted[0][0]:'—';
  const labels=sorted.map(x=>x[0]); const data=sorted.map(x=>x[1]);
  const colors=labels.map(l=>CAT_COLORS[l]||'#888');
  if(catChart){ catChart.destroy(); catChart=null; }
  const ctx=document.getElementById('cat-chart').getContext('2d');
  catChart=new Chart(ctx,{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>' '+fmtAmt(i.raw)+' ('+Math.round(i.raw/total*100)+'%)'}}}}
  });
  document.getElementById('cat-legend').innerHTML=labels.map((l,i)=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:${colors[i]}"></span>${l}: ${fmtAmt(data[i])}</span>`).join('');
  const bd=document.getElementById('cat-breakdown');
  if(!sorted.length){ bd.innerHTML='<div class="empty">No expenses for this period</div>'; return; }
  bd.innerHTML=sorted.map(([cat,amt])=>`<div class="summary-row"><span style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${CAT_COLORS[cat]||'#888'};display:inline-block"></span>${cat}</span><span>${fmtAmt(amt)}</span></div>`).join('')
    +`<div class="summary-row"><span>Total</span><span>${fmtAmt(total)}</span></div>`;
}

document.getElementById('inp-date').value=today();
renderToday();
</script>
</body>
</html>
